[package]
name = "tauri-app-ui"
version = "0.1.0"
edition = "2021"

[workspace]
resolver = "2"
members = ["audio-system", "common", "src-tauri"]

[workspace.dependencies]
audio-system = { path = "audio-system" }
common = { path = "common" }
fastrand = "2.3.0"
fundsp = "0.20"
leptos_router = { version = "0.8", features = ["nightly"] }
log = "0.4"
mint = { version = "0.5.9", features = ["serde"] }
ringbuf = "0.4.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.27.2", features = ["derive"] }
tauri = { version = "2" }
thiserror = "2.0.16"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
common = { workspace = true }
console_error_panic_hook = "0.1.7"
js-sys = "0.3"
keyframe = "1.1.1"
keyframe_derive = "1.0.0"
leptos = { version = "0.8", features = ["csr", "nightly"] }
leptos_router = { workspace = true }
leptos_styling = { version = "0.2", features = ["csr"] }
leptos-use = { version = "0.16.2", default-features = false, features = [
  "signal_debounced",
  "use_document",
  "use_draggable",
  "use_element_bounding",
  "use_element_size",
  "use_preferred_dark",
  "use_prefers_reduced_motion",
  "use_raf_fn",
  "use_timeout_fn",
  "use_window",
  "use_window_size",
] }
log = { workspace = true }
mint = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde-wasm-bindgen = "0.6"
strum = { workspace = true, features = ["derive"] }
tauri-use = "0.2.2"
thiserror = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "*"

[dev-dependencies]
common = { workspace = true, features = ["test"] }
