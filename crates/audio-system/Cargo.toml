[package]
name = "audio-system"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { workspace = true }
console_error_panic_hook = { workspace = true, optional = true }
# Runtime optional deps
cpal = { version = "0.16", optional = true }
dasp_sample = { version = "0.11.0", optional = true }
fastrand = { workspace = true }
fundsp = { workspace = true, default-features = false, features = ["std"] }
js-sys = { workspace = true, optional = true }
log = { workspace = true }
parking_lot = "0.12"
ringbuf = { workspace = true }
spectrum-analyzer = "1.7.0"
u-num-it = "0.3.1"
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
objc = "0.2"

[features]
default = ["hi_fi"]
editor = []
hi_fi = []
# Native CPAL runtime
rt_cpal = ["dep:cpal", "dep:dasp_sample"]
# Messaging runtime
rt_web = []
# Audio unit worklet
rt_web_audio_unit = [
  "dep:js-sys",
  "dep:wasm-bindgen",
  "dep:web-sys",
  "fastrand/js"
]
