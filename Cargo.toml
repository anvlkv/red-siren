[workspace]
resolver = "2"
members = [
  "crates/audio-system",
  "crates/common",
  "crates/frontend",
  "src-tauri",
]

[workspace.dependencies]
audio-system = { path = "crates/audio-system" }
common = { path = "crates/common" }
console_error_panic_hook = "0.1.7"
fastrand = "2.3.0"
fundsp = { version = "0.20", default-features = false, features = ["std"] }
js-sys = "0.3"
leptos_router = { version = "0.8", features = ["nightly"] }
log = "0.4"
mint = { version = "0.5.9", features = ["serde"] }
ringbuf = "0.4.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.27.2", features = ["derive"] }
tauri = { version = "2", features = ["rustls-tls"] }
thiserror = "2.0.16"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "*"
