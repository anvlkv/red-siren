name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-preview:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
            target: 'x86_64-unknown-linux-gnu'
            artifact_name: 'linux-x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install frontend dependencies
        run: npm ci

      - name: Add node_modules/.bin to PATH
        run: echo "${{ github.workspace }}/node_modules/.bin" >> $GITHUB_PATH

      - name: Install Trunk
        uses: jetli/trunk-action@v0.4.0
        with:
          version: 'latest'

      - name: Install Tauri CLI
        uses: baptiste0928/cargo-install@v3
        with:
          crate: tauri-cli
          version: '^2.0'
          cache-key: tauri-cli-v2

      - name: Build Tauri app
        run: cargo tauri build ${{ matrix.args }}

      - name: Upload preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.artifact_name }}-${{ github.event.pull_request.number }}
          path: |
            src-tauri/target/*/release/bundle/
            src-tauri/target/*/release/*.exe
            src-tauri/target/*/release/*.app
          if-no-files-found: warn
          retention-days: 30

  build-mobile-preview:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-latest'
            target: 'android'
            mobile-targets: 'aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.mobile-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install frontend dependencies
        run: npm ci

      - name: Add node_modules/.bin to PATH
        run: echo "${{ github.workspace }}/node_modules/.bin" >> $GITHUB_PATH

      - name: Install Trunk
        uses: jetli/trunk-action@v0.4.0
        with:
          version: 'latest'

      - name: Install Tauri CLI
        uses: baptiste0928/cargo-install@v3
        with:
          crate: tauri-cli
          version: '^2.0'
          cache-key: tauri-cli-v2

      - name: Setup Java (Android only)
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        if: matrix.target == 'android'
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        if: matrix.target == 'android'
        run: |
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393"

      - name: Setup Android environment
        if: matrix.target == 'android'
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.1.8937393" >> $GITHUB_ENV

      - name: Initialize mobile platform
        run: |
          if [ "${{ matrix.target }}" = "android" ]; then
            cargo tauri android init
          elif [ "${{ matrix.target }}" = "ios" ]; then
            cargo tauri ios init
          fi

      - name: Build mobile app
        run: |
          if [ "${{ matrix.target }}" = "android" ]; then
            cargo tauri android build --apk
          elif [ "${{ matrix.target }}" = "ios" ]; then
            cargo tauri ios build
          fi

      - name: Upload mobile preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.target }}-${{ github.event.pull_request.number }}
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/apple/**/*.app
          if-no-files-found: warn
          retention-days: 30

  comment-on-pr:
    needs: [build-preview, build-mobile-preview]
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const runId = context.runId;
            const comment = `## 🎉 Preview Build Complete!
            
            Preview artifacts have been generated for this PR. You can download them from the [Actions tab](${context.payload.repository.html_url}/actions/runs/${runId}).
            
            ### Available Previews:
            - 🐧 Linux (x64)
            - 📱 Android (APK)
            
            Artifacts will be retained for 30 days.`;
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment
            });
