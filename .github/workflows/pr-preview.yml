name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-preview:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
            artifact_name: 'macos-arm64'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
            artifact_name: 'macos-x64'
          - platform: 'ubuntu-22.04'
            args: ''
            target: 'x86_64-unknown-linux-gnu'
            artifact_name: 'linux-x64'
          - platform: 'windows-latest'
            args: ''
            target: 'x86_64-pc-windows-msvc'
            artifact_name: 'windows-x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown,${{ matrix.target }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Tailwind CSS CLI
        run: |
          npx tailwindcss --help || echo "Tailwind CSS CLI installed"

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: 'latest'

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Create preview artifacts
        run: |
          mkdir -p preview-artifacts
          if [ -d "src-tauri/target/release/bundle" ]; then
            cp -r src-tauri/target/release/bundle/* preview-artifacts/ || true
          fi
          if [ -d "src-tauri/target/${{ matrix.target }}/release/bundle" ]; then
            cp -r src-tauri/target/${{ matrix.target }}/release/bundle/* preview-artifacts/ || true
          fi
        shell: bash

      - name: Upload preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.artifact_name }}-${{ github.event.pull_request.number }}
          path: preview-artifacts/**/*
          if-no-files-found: warn
          retention-days: 30

  build-mobile-preview:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            target: 'android'
            artifact_name: 'android'
          - platform: 'macos-latest'
            target: 'ios'
            artifact_name: 'ios'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install Rust (Android)
        if: matrix.target == 'android'
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown,aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Rust (iOS)
        if: matrix.target == 'ios'
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Setup Java (Android only)
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        if: matrix.target == 'android'
        uses: android-actions/setup-android@v3

      - name: Install NDK (Android only)
        if: matrix.target == 'android'
        run: |
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Tailwind CSS CLI
        run: |
          npx tailwindcss --help || echo "Tailwind CSS CLI installed"

      - name: Install Trunk
        uses: jetli/trunk-action@v0.5.0
        with:
          version: 'latest'

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build mobile app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.target }} build

      - name: Upload mobile preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.artifact_name }}-${{ github.event.pull_request.number }}
          path: |
            src-tauri/gen/android/app/build/outputs/**/*.apk
            src-tauri/gen/apple/build/**/*.app
          if-no-files-found: warn
          retention-days: 30

  comment-on-pr:
    needs: [build-preview, build-mobile-preview]
    runs-on: ubuntu-22.04
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const runId = context.runId;
            const comment = `## 🎉 Preview Build Complete!
            
            Preview artifacts have been generated for this PR. You can download them from the [Actions tab](${context.payload.repository.html_url}/actions/runs/${runId}).
            
            ### Available Previews:
            - 🍎 macOS (ARM64 & x64)
            - 🐧 Linux (x64)
            - 🪟 Windows (x64)
            - 📱 Android (APK)
            - 🍏 iOS (App)
            
            Artifacts will be retained for 30 days.`;
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment
            });
