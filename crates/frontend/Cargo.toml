[package]
name = "frontend"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { workspace = true }
console_error_panic_hook = { workspace = true }
js-sys = { workspace = true }
keyframe = "1.1.1"
keyframe_derive = "1.0.0"
leptos = { version = "0.8.15", features = ["csr", "nightly"] }
leptos_router = { version = "0.8.11", features = ["nightly"] }
leptos_styling = { version = "0.3.1", features = ["csr"] }
leptos-use = { version = "0.17.0", default-features = false, features = [
  "signal_debounced",
  "use_device_pixel_ratio",
  "use_document",
  "use_draggable",
  "use_element_bounding",
  "use_element_size",
  "use_mouse_in_element",
  "use_preferred_dark",
  "use_prefers_reduced_motion",
  "use_raf_fn",
  "use_timeout_fn",
  "use_window",
  "use_window_size"
] }
log = { workspace = true }
mint = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde-wasm-bindgen = "0.6"
strum = { workspace = true, features = ["derive"] }
tauri-use = "0.2.2"
thiserror = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
  "CanvasRenderingContext2d",
  "DataTransfer",
  "Document",
  "DragEvent",
  "Event",
  "HtmlCanvasElement",
  "ImageData",
  "MouseEvent",
  "UiEvent",
  "WheelEvent"
] }
web-time = "1.1"

[dev-dependencies]
common = { workspace = true, features = ["test"] }
