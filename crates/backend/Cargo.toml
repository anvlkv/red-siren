[package]
name = "backend"
version = "0.1.0"
edition = "2021"
description = "A Tauri App"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "backend_lib"

[dependencies]
audio-system = { workspace = true, optional = true }
common = { workspace = true, features = ["tauri"] }
cpal = { version = "0.16", optional = true }
dasp_sample = "0.11.0"
fastrand = { workspace = true, optional = true }
fundsp = { workspace = true }
log = { workspace = true }
mint = { workspace = true, features = ["serde"] }
parking_lot = "0.12"
ringbuf = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true, features = ["derive"] }
tauri = { workspace = true, features = ["rustls-tls"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-prevent-default = "3"
tauri-plugin-store = "2"
tokio = { version = "1" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "test-util"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
raw-window-handle = "0.6.2"

[target."cfg(target_os = \"windows\")".dependencies]
tauri-plugin-prevent-default = { version = "3", features = ["platform-windows"] }

[features]
default = ["cpal_audio"]
cpal_audio = ["dep:audio-system", "dep:cpal", "dep:fastrand"]
web_audio_unit = []
