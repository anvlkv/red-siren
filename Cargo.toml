[package]
name = "tauri-app-ui"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["shared", "src-tauri"]

[workspace.dependencies]
leptos_router = { version = "0.8", features = ["nightly"] }
log = "0.4"
mint = { version = "0.5.9", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared = { path = "shared" }
strum = { version = "0.27.2", features = ["derive"] }
thiserror = "2.0.16"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3"
keyframe = "1.1.1"
keyframe_derive = "1.0.0"
leptos = { version = "0.8", features = ["csr", "nightly"] }
leptos_router = { workspace = true }
leptos-use = { version = "0.16.2", default-features = false, features = [
  "use_document",
  "use_preferred_dark",
  "use_prefers_reduced_motion",
  "use_raf_fn",
  "use_window",
  "use_window_size",
] }
log = { workspace = true }
mint = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde-wasm-bindgen = "0.6"
shared = { workspace = true }
strum = { workspace = true, features = ["derive"] }
tauri-use = "0.2.2"
thiserror = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
