<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Red Siren</title>
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <meta name="color-scheme" content="light dark" />
        <style>
            /* Full-viewport reset */
            html,
            body {
                height: 100%;
                margin: 0;
            }

            /* CSS variables for easy swapping if needed */
            :root {
                --splash-light: url("public/Splash-light.png");
                --splash-dark: url("public/Splash-dark.png");
            }

            /* Default (light) background */
            body {
                background-image: var(--splash-light);
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
                background-color: #e30022; /* fallback while image loads */
                min-height: 100vh;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            /* Use dark image when user prefers dark color scheme */
            @media (prefers-color-scheme: dark) {
                body {
                    background-image: var(--splash-dark);
                    background-color: #353839;
                }
            }

            /* Optional: ensure the background covers devices with dynamic viewport (mobile address bar) */
            @supports (height: 100dvh) {
                html,
                body {
                    height: 100dvh;
                }
            }
        </style>
    </head>
    <body></body>
</html>
