[package]
name = "audio-system"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { workspace = true }
console_error_panic_hook = { workspace = true, optional = true }
# Runtime optional deps
cpal = { version = "0.17.3", optional = true }
dasp_sample = { version = "0.11.0", optional = true }
dyn-clone = "1.0.20"
fastrand = { workspace = true }
fundsp = { workspace = true, default-features = false, features = ["std"] }
js-sys = { workspace = true, optional = true }
log = { workspace = true }
mint = { workspace = true }
num-complex = "0.4.6"
num-rational = "0.4.2"
ordered-float = "5.3.0"
parking_lot = "0.12"
spectrum-analyzer = "1.7.0"
tokio = { workspace = true, features = ["rt-multi-thread"] }
u-num-it = "0.3.4"
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true }

[dev-dependencies]
common = { workspace = true, features = ["test"] }
insta = { workspace = true }
insta-fun = "2.2.2"
test-log = "0.2"

[target.'cfg(target_os = "ios")'.dependencies]
objc = "0.2"

[features]
default = []
cargo-clippy = []
editor = []
# Native CPAL runtime
rt_cpal = ["dep:cpal", "dep:dasp_sample"]
# Messaging runtime
rt_web = []
# Audio unit worklet
rt_web_audio_unit = [
  "dep:js-sys",
  "dep:wasm-bindgen",
  "dep:web-sys",
  "fastrand/js"
]
