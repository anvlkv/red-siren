[package]
name = "tauri-app"
version = "0.1.0"
edition = "2021"
description = "A Tauri App"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
name = "tauri_app_lib"

[dependencies]
audio-system = { workspace = true }
common = { workspace = true }
dasp_sample = "0.11.0"
fundsp = { workspace = true }
log = { workspace = true }
mint = { workspace = true, features = ["serde"] }
parking_lot = "0.12"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true, features = ["derive"] }
tauri = { workspace = true, features = ["rustls-tls"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-prevent-default = "4"
tauri-plugin-safe-area-insets-css = "0.2"
tauri-plugin-store = "2"
tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "test-util"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
raw-window-handle = "0.6.2"

[target."cfg(target_os = \"windows\")".dependencies]
tauri-plugin-prevent-default = { version = "4", features = ["platform-windows"] }
