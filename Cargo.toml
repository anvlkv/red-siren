[package]
name = "tauri-app-ui"
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.16"
log = "0.4"
shared = { path="shared" }
mint = { version = "0.5.9", features = ["serde"] }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
leptos = { version = "0.8", features = ["csr", "nightly"] }
leptos-use = { version = "0.16.2", default-features = false, features = ["use_window", "use_document", "use_raf_fn"] }
leptos_router = { version = "0.8", features = ["nightly"]}
tauri-use = "0.2.2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"
keyframe = "1.1.1"
serde = { workspace = true, features = ["derive"] }
thiserror = {workspace = true}
log = {workspace = true}
shared = { workspace = true }
mint = { workspace = true, features = ["serde"] }

[workspace]
members = ["shared","src-tauri"]
