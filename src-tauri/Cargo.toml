[package]
name = "red-siren"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "red_siren_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18.1"
ts-rs = "12.0.1"
tauri-plugin-log = "2"
log = "0.4"
thiserror = "2.0.18"
parking_lot = {version = "0.12.5", features = ["deadlock_detection", "nightly"] }
tauri-plugin-prevent-default = "5"
dasp_sample = "0.11.0"
thingbuf = "0.1.6"
num-traits = "0.2.19"
atomic_float = "1.1.0"


[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
raw-window-handle = "0.6.2"

[target.'cfg(target_os = "ios")'.dependencies]
objc = "0.2"

[target."cfg(target_os = \"windows\")".dependencies]
tauri-plugin-prevent-default = { version = "5", features = ["platform-windows"] }


[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
