[package]
name = "tauri-app"
version = "0.1.0"
edition = "2021"
description = "A Tauri App"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]
name = "tauri_app_lib"

[dependencies]
log = { workspace = true }
tauri = { workspace = true, features = ["rustls-tls"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
raw-window-handle = "0.6.2"

[features]
default = []
devtools = ["tauri/devtools"]
